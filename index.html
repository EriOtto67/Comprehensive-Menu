<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>尾賀亀LINEサービス</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: sans-serif;
}

.container {
    max-width: 600px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #06C755;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
    font-size: 14px;
}

.card {
    background: #ffffff;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    border-top: 4px solid #06C755;
    cursor: pointer;
    transition: all 0.2s;
}

.card:hover,
.card:active {
    background: #f9fff9;
}

.card-title {
    font-size: 18px;
    font-weight: bold;
    color: #06C755;
    margin-bottom: 10px;
}

.card-description {
    color: #666;
    font-size: 14px;
    line-height: 1.5;
}

.footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 20px;
}
</style>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>

<body>

<div class="container">

    <h1>尾賀亀LINEサービス</h1>

    <div class="subtitle">
        ご利用されるサービスを選択してください
    </div>

    <!-- お客さま情報LINE連携 -->

    <div class="card" onclick="openCustomer()">

        <div class="card-title">
            🚗お客さま情報LINE連携 ＞
        </div>

        <div class="card-description">
            お客さま情報のLINE連携を行います。
        </div>

    </div>

    <!-- VoC -->

    <div class="card" onclick="openVoC()">

        <div class="card-title">
            💬ご意見・ご要望 ＞
        </div>

        <div class="card-description">
            サービス向上のため、ご意見・ご要望をお聞かせください。
        </div>

    </div>

    <!-- 問い合わせ -->

    <div class="card" onclick="sendGasPrice()">

    <div class="card-title">
        ⛽ガソリン価格確認 ＞
    </div>

    <div class="card-description">
        現在のガソリン価格を確認します。
    </div>

</div>

    <div class="footer">
        ENEOSサービスメニュー
    </div>

</div>

<script>

const LIFF_ID = "2010920922-51evKItV";

liff.init({
    liffId: LIFF_ID
});

function openCustomer() {
    window.location.href = "https://liff.line.me/2010920922-ezMC4vGF";
}

function openVoC() {
    window.location.href = "https://liff.line.me/2010920922-MHVBC0L1";
}

async function sendGasPrice() {

    try {

        await liff.sendMessages([
            {
                type: "text",
                text: ">>ガソリン価格"
            }
        ]);

        liff.closeWindow();

    } catch (error) {

        console.error(error);

    }
}

</script>

</body>
</html>
